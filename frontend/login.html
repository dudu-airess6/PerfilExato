<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerfilExato SENAI - Entrar</title>
    
    <!-- Fontes Oficiais da Plataforma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="form-box">
            
            <!-- Logo do Sistema -->
            <div class="login-logo">
                <img src="img/Logo.png" alt="Logo SENAI" class="logo-icone-login">
                <span>PerfilExato</span>
            </div>
            
            <h2>Entrar na plataforma</h2>
            
            <form id="form-login">
                <div class="input-group">
                    <label for="email-login">E-mail</label>
                    <input type="email" id="email-login" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="senha-login">Senha</label>
                    <input type="password" id="senha-login" required placeholder="••••••••">
                </div>
                
                <!-- Grupo de Botões Empilhados -->
                <button type="submit" class="btn-auth-submit">Entrar</button>
                <a href="index.html" class="btn-auth-secondary">Voltar para o início</a>
            </form>
            
            <p class="toggle-text">Não tem uma conta? <a href="cadastro.html" class="toggle-link">Registre-se aqui</a></p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
